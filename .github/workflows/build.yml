name: Build PR3 Studio Pro (Signed APK, AAB & Certificates)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: سحب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت حزم Capacitor وتجهيز ملفات الويب
        run: |
          npm install
          npm run prepare-web

      - name: تنظيف أكواد الجافا وبناء مجلد Android نظيف
        run: |
          python3 - << 'PYEOF'
          import os, re

          os.makedirs("_backup_java", exist_ok=True)

          sources = []
          for root_dir in ["android/app/src/main/java", "."]:
              if not os.path.exists(root_dir):
                  continue
              for r, dirs, files in os.walk(root_dir):
                  if root_dir == "." and any(x in r for x in ["node_modules", "_backup_java", "android", ".git"]):
                      continue
                  for fn in files:
                      clean_fn = re.sub(r'[^A-Za-z0-9_.]', '', fn)
                      if clean_fn.endswith(".java"):
                          sources.append((os.path.join(r, fn), clean_fn))

          for full_path, clean_fn in sources:
              with open(full_path, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              code = re.sub(r'[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]', '', code)

              if re.search(r'^\s*package\s+[\w.]+;', code, flags=re.M):
                  code = re.sub(r'^\s*package\s+[\w.]+;', 'package io.github.karamegy.pr3;', code, count=1, flags=re.M)
              else:
                  code = 'package io.github.karamegy.pr3;\n\n' + code

              m = re.search(r'\bpublic\s+(?:final\s+|abstract\s+)?class\s+([A-Za-z0-9_]+)', code)
              target_name = f"{m.group(1)}.java" if m else clean_fn

              with open(os.path.join("_backup_java", target_name), "w", encoding="utf-8") as f:
                  f.write(code)
          PYEOF

          rm -rf android
          npx cap add android
          rm -rf android/app/src/main/java
          mkdir -p android/app/src/main/java/io/github/karamegy/pr3
          cp -f _backup_java/*.java android/app/src/main/java/io/github/karamegy/pr3/
          rm -rf _backup_java
          npx cap sync android

      - name: تركيب لوجو التطبيق الخاص بنا (Icon512.jpg) بجميع المقاسات
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image, ImageDraw

          icon_path = None
          for candidate in ["Icon512.jpg", "icon512.jpg", "Icon512.png", "icon512.png"]:
              if os.path.exists(candidate):
                  icon_path = candidate
                  break

          if not icon_path:
              raise FileNotFoundError("لم يتم العثور على ملف اللوجو Icon512.jpg في المجلد الرئيسي للمشروع!")

          res_dir = "android/app/src/main/res"

          for pattern in [
              f"{res_dir}/mipmap-*/ic_launcher*",
              f"{res_dir}/drawable*/ic_launcher*",
              f"{res_dir}/values/ic_launcher_background.xml",
          ]:
              for f in glob.glob(pattern):
                  if os.path.isfile(f):
                      os.remove(f)

          img = Image.open(icon_path).convert("RGBA")
          w, h = img.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          img = img.crop((left, top, left + side, top + side))

          bg_pixel = img.getpixel((0, 0))
          bg_hex = "#{:02X}{:02X}{:02X}".format(bg_pixel[0], bg_pixel[1], bg_pixel[2])

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }

          for density, (legacy_size, fg_size) in densities.items():
              mipmap_dir = os.path.join(res_dir, f"mipmap-{density}")
              os.makedirs(mipmap_dir, exist_ok=True)

              standard = img.resize((legacy_size, legacy_size), Image.Resampling.LANCZOS)
              standard.save(os.path.join(mipmap_dir, "ic_launcher.png"), "PNG")

              mask = Image.new("L", (legacy_size, legacy_size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, legacy_size, legacy_size), fill=255)
              round_icon = Image.new("RGBA", (legacy_size, legacy_size), (0, 0, 0, 0))
              round_icon.paste(standard, (0, 0), mask)
              round_icon.save(os.path.join(mipmap_dir, "ic_launcher_round.png"), "PNG")

              fg_canvas = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              inner_size = int(fg_size * 0.74)
              inner_icon = img.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
              offset = (fg_size - inner_size) // 2
              fg_canvas.paste(inner_icon, (offset, offset), inner_icon)
              fg_canvas.save(os.path.join(mipmap_dir, "ic_launcher_foreground.png"), "PNG")

          values_dir = os.path.join(res_dir, "values")
          os.makedirs(values_dir, exist_ok=True)
          with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w", encoding="utf-8") as f:
              f.write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">{bg_hex}</color>\n</resources>\n')

          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              with open(os.path.join(anydpi_dir, name), "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)

          print(f"✅ تم تركيب اللوجو ({icon_path}) بنجاح بجميع المقاسات")
          PYEOF

      - name: التحقق الإلزامي من شهادة التوقيع ومطابقة البصمات المعتمدة فقط
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing-bundle

          EXPECTED_REL_SHA1="6F:6A:6C:43:66:56:D9:98:69:EF:27:40:73:4D:61:2B:33:0D:C5:EA"
          EXPECTED_REL_SHA256="2D:2E:E9:8B:84:0D:7B:5B:67:FD:6B:85:99:73:33:0F:79:E0:5B:9A:32:5F:1C:66:0F:4B:E6:72:48:FD:E0:8D"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ خطأ: المتغير KEYSTORE_BASE64 غير موجود في GitHub Secrets!"
            echo "يرجى لصق محتوى keystore_base64.txt الخاص بالبصمة المعتمدة في Secrets لمنع توليد بصمات جديدة."
            exit 1
          fi

          KS_PASS="${KEYSTORE_PASSWORD:-PR3Studio@2026}"
          K_ALIAS="${KEY_ALIAS:-pr3releasekey}"
          K_PASS="${KEY_PASSWORD:-PR3Studio@2026}"

          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > signing-bundle/pr3-release.keystore

          REL_INFO=$(keytool -list -v -keystore signing-bundle/pr3-release.keystore -alias "$K_ALIAS" -storepass "$KS_PASS")
          REL_SHA1=$(echo "$REL_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          REL_SHA256=$(echo "$REL_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')

          if [ "$REL_SHA1" != "$EXPECTED_REL_SHA1" ] || [ "$REL_SHA256" != "$EXPECTED_REL_SHA256" ]; then
            echo "❌ فشل التحقق: الشهادة المرفوعة لا تطابق البصمات المعتمدة!"
            echo "المتوقع SHA-256: $EXPECTED_REL_SHA256"
            echo "الفعلي  SHA-256: $REL_SHA256"
            exit 1
          fi

          cp -f signing-bundle/pr3-release.keystore android/app/pr3-release.keystore

          keytool -exportcert -rfc \
            -keystore signing-bundle/pr3-release.keystore \
            -alias "$K_ALIAS" \
            -storepass "$KS_PASS" \
            -file signing-bundle/deployment_cert.pem

          keytool -exportcert \
            -keystore signing-bundle/pr3-release.keystore \
            -alias "$K_ALIAS" \
            -storepass "$KS_PASS" \
            -file signing-bundle/deployment_cert.der

          cat << EOF > signing-bundle/VERIFIED_FINGERPRINTS.txt
          ============================================================
          بصمات التوقيع المعتمدة والموثقة - تطبيق PR3 Studio Pro
          Package Name: io.github.karamegy.pr3
          ============================================================
          SHA-1:   $REL_SHA1
          SHA-256: $REL_SHA256
          EOF

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### بصمات التوقيع المعتمدة والموثقة (PR3 Studio Pro)
          * **Verified SHA-1:** \`$REL_SHA1\`
          * **Verified SHA-256:** \`$REL_SHA256\`
          EOF

      - name: حقن صلاحيات سامسونج وخدمة الطباعة وتوحيد التوقيع في Android
        run: |
          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()

          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
          """

          share_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
          """

          print_service = """
                  <service
                      android:name=".PR3PrintService"
                      android:exported="true"
                      android:permission="android.permission.BIND_PRINT_SERVICE">
                      <intent-filter>
                          <action android:name="android.printservice.PrintService" />
                      </intent-filter>
                  </service>
          """

          if "BLUETOOTH_CONNECT" not in manifest:
              manifest = manifest.replace("</manifest>", perms + "\n</manifest>")
          if "ACTION_SEND" not in manifest:
              manifest = manifest.replace("</activity>", share_filter + "\n        </activity>", 1)
          if "PR3PrintService" not in manifest:
              manifest = manifest.replace("</application>", print_service + "\n    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle = f.read()

          signing_block = """
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("app/pr3-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "PR3Studio@2026"
                      keyAlias System.getenv("KEY_ALIAS") ?: "pr3releasekey"
                      keyPassword System.getenv("KEY_PASSWORD") ?: "PR3Studio@2026"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }"""

          if "signingConfigs" not in gradle:
              gradle = gradle.replace("buildTypes {", signing_block, 1)
              gradle = gradle.replace(
                  "minifyEnabled false",
                  "signingConfig signingConfigs.release\n            minifyEnabled false",
                  1
              )

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle)
          PYEOF

      - name: بناء الحزم الموقعة بالبصمة المعتمدة (APK & AAB)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace 2>&1 | tee build.log || {
            echo "================ أخطاء مترجم Java ================"
            grep -n -C 3 "error:" build.log || tail -n 40 build.log
            exit 1
          }

      - name: رفع حزم التطبيق الموقعة (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: PR3-Studio-Pro-Builds
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: رفع شهادات التوقيع الموثقة
        uses: actions/upload-artifact@v4
        with:
          name: PR3-Certificates-And-Fingerprints
          path: signing-bundle/
